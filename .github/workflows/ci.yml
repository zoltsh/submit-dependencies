name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "29 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submit-dependencies-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin="$RUNNER_TEMP/actionlint-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check repository
        run: scripts/check
      - name: Check dependency vulnerabilities
        run: npm audit
      - name: Check clean generated state
        run: git diff --exit-code

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  integration:
    name: pinned Zolt ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Zolt source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zoltsh/zolt
          ref: 5ba5361d856fd43d65e4ca2d933271a6eff01c3f
          path: zolt-workspace
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify published binary contracts
        env:
          EXPECTED_ZOLT_TARGET: ${{ matrix.target }}
          RUN_LIVE_ZOLT_STANDALONE: ${{ matrix.target == 'linux-x64' }}
          RUN_LIVE_ZOLT_WORKSPACE: "true"
          ZOLT_LIVE_WORKSPACE: ${{ github.workspace }}/zolt-workspace
        run: npx vitest run test/live-workspace.test.ts test/live-standalone.test.ts

  windows-negative:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject Windows before installation
        id: submit
        continue-on-error: true
        uses: ./

      - name: Require closed failure
        shell: pwsh
        env:
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
        run: |
          if ($env:SUBMIT_OUTCOME -ne "failure") {
            throw "The action unexpectedly accepted a Windows runner."
          }
