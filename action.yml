name: Submit Zolt dependencies
description: Submit the complete locked Zolt dependency graph to GitHub
author: zoltsh

inputs:
  directory:
    description: Project directory or any directory within the target Zolt workspace
    required: false
    default: .
  workspace:
    description: "Workspace behavior: auto, true, or false"
    required: false
    default: auto
  github-token:
    description: Token used to submit the dependency snapshot
    required: false
    default: ${{ github.token }}
  validate-lock:
    description: Resolve with --locked before submission; valid only when state is submit
    required: false
    default: "false"
  validation-env:
    description: Newline-separated environment variable names passed only to submit-state locked validation
    required: false
  state:
    description: "Snapshot operation: submit or clear"
    required: false
    default: submit
  manifest-path:
    description: Absent repository-relative zolt.lock path to clear; required only when state is clear
    required: false

outputs:
  snapshot-id:
    description: GitHub dependency snapshot ID
  dependency-count:
    description: Number of external dependencies submitted
  zolt-version:
    description: Exact Zolt version used by the action; empty when clearing

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: purple
